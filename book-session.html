<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book A Session</title>
    <link rel="stylesheet" href="book-session.css">
</head>

<body>
    <header class="header">
        <div class="wrap header-inner">

            <a href="homepage.html">
                <img class="logo" src="nobg.png" alt="BYTES Gaming Lounge">
            </a>

            <button class="menu" aria-label="Open navigation">☰</button>

            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="zones.html" class="active">Gaming Zones</a>
                <a href="memberships.html">Memberships</a>
                <a href="events.html">Events</a>
                <a href="about.html">About</a>
            </nav>

            <a class="book-link" href="book-session.html">
                🎮 &nbsp;Book a Session
            </a>

        </div>
    </header>
    <main>
        <section class="wrap page-top">
            <h1 class="page-title">Book a Session</h1>
            <p class="page-intro">Reserve your spot and get ready to play.</p>
        </section>
        <section class="wrap section booking-grid">
            <form class="form-panel" data-form>
                <div class="zone-tabs"><span>PC Gaming</span><span>Console Gaming</span><span>Racing Zone</span></div>
                <div class="form-grid">
                    <div class="field full"><label>Choose Game Zone</label><select required>
                            <option value="">Choose your zone</option>
                            <option>PC Gaming</option>
                            <option>Console Gaming</option>
                            <option>Racing Zone</option>
                        </select></div>
                    <div class="field full"><label>Select Date</label><input id="date" type="date" required></div>
                    <div class="field full"><label>Select Time</label><select required>
                            <option value="">Choose time</option>
                            <option>10:00 AM</option>
                            <option>12:00 PM</option>
                            <option>2:00 PM</option>
                            <option>4:00 PM</option>
                            <option>6:00 PM</option>
                            <option>8:00 PM</option>
                        </select></div>
                    <div class="field full"><label>Number of Players</label><select required>
                            <option value="">Number of Players</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5+</option>
                        </select></div>
                    <div class="field full"><button class="btn btn-green" type="submit" style="width:100%">Book Now
                            &nbsp;→</button></div>
                </div>
                <p class="notice"></p>
                <p style="font-size:8px;color:var(--muted);margin-top:8px">Demo form only — no live reservation is
                    created.</p>
            </form>
            <div class="booking-photo"></div>
        </section>

    </main>


    <footer class="footer">
        <div class="wrap footer-inner">

            <div>
                <img src="nobg.png" alt="BYTES">
                <p>© 2026 BYTES Gaming Lounge · Beirut, Lebanon</p>
            </div>

            <div class="footer-links">
                <a href="zones.html">Gaming Zones</a>
                <a href="memberships.html">Memberships</a>
                <a href="gal.html">Gallery</a>
                <a href="faq.html">FAQ</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </footer>

</body>

</html>
